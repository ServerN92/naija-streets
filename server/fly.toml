# Naija Streets live server on Fly.io. London (lhr): from Lagos the internet cables run to Europe, so London answers faster than Johannesburg.
app = "naija-streets"
primary_region = "lhr"

[build]

[env]
  PORT = "8080"
  ROOM_CAP = "40"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
